name: Unzip Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'

permissions:
  contents: write # ضروری برای اجازه دادن به گیت‌هاب جهت ذخیره تغییرات (Commit)

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract ZIP files
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f" -d extracted_files/
            fi
          done

      - name: Commit extracted files back to repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-unzip uploaded archive"
          branch: main
