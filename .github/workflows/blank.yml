name: Unzip Archive

on:
  push:
    branches:
      - main
    paths:
      - '**.zip' # هر زمان فایل زیپ جدیدی پوش شد اجرا شود

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          # پیدا کردن و استخراج تمام فایل‌های زیپ موجود در پوشه اصلی
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f" -d extracted_files/
            fi
          done

      - name: Commit extracted files back to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-unzip uploaded archive"
          branch: main
