name: Build TimeLine APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          echo "Locating build.gradle inside extracted_files..."
          PROJECT_DIR=$(find extracted_files -name "build.gradle" -o -name "build.gradle.kts" -type f -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Could not find any build.gradle file in extracted_files!"
            exit 1
          fi
          
          echo "Found project root at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # اگر gradlew وجود نداشت، آن را به صورت خودکار بساز
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found. Generating it..."
            gradle wrapper --gradle-version 8.11.1
          fi
          
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeLine-debug-apk
          path: extracted_files/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
