name: Build TimeLine APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: |
          # پیدا کردن پوشه‌ای که فایل build.gradle یا تنظیمات اندروید در آن است
          PROJECT_DIR=$(find extracted_files -name "build.gradle" -o -name "build.gradle.kts" -type f -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Could not find any build.gradle file in extracted_files!"
            exit 1
          fi
          
          echo "Found project root at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # تولید خودکار gradlew در صورتی که وجود نداشته باشد
          echo "Generating Gradle Wrapper..."
          gradle wrapper --gradle-version 8.11.1
          
          # اعطای دسترسی اجرایی و ساخت APK
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeLine-debug-apk
          path: extracted_files/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
